            border-radius: 20px; 
            border: 2px dashed #fbc02d; 
            margin: 20px 0; 
            font-size: 22px;

            min-height: 120px; 
            display: flex;
            align-items: center; 
            justify-content: flex-start; 
            text-align: left;

            border: 3px solid #eee; 
            border-radius: 15px; 
            padding: 18px; 
            font-size: 19px; 
            background: #fff; 
            text-align: left;

        .card.correct { border-color: #4caf50; background: #e8f5e9; }
        .card.wrong { border-color: #ef5350; background: #ffebee; }
        
        .btn { 
            display: block; 
            width: 240px; 
            margin: 20px auto; 
            padding: 15px; 
            background: var(--secondary); 
            color: white; 
            border: none; 
            border-radius: 50px; 
            font-size: 20px; 
            cursor: pointer; 
            box-shadow: 0 5px 0 #e65100; 
            font-weight: bold; 
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #e65100; }
        
        .progress-header { font-weight: bold; color: #558b2f; margin-bottom: 15px; font-size: 18px; }

        { id: 72, q: "「蜘蛛並不是昆蟲，因為牠們有幾隻腳？」", a: "八隻", o: ["八隻", "六隻", "四隻"] },
        { id: 73, q: "「昆蟲的身體分為頭、胸、腹三部分，而且有幾對翅膀？」", a: "兩對", o: ["兩對", "一對", "沒有翅膀"] },
        { id: 74, q: "「螞蟻和蜜蜂屬於什麼生物，會分工合作一起生活？」", a: "社會性昆蟲", o: ["社會性昆蟲", "孤獨性生物", "寄生生物"] },
        { id: 75, q: "「仙人掌的刺其實是由什麼部分演化而來的？」", a: "葉子", o: ["葉子", "莖", "根"] },
        { id: 76, q: "「為了保護自己，身體顏色變得跟環境一樣，這叫什麼色？」", a: "保護色", o: ["保護色", "警告色", "流行色"] },
        { id: 77, q: "「有些動物冬天會躲起來睡覺，不吃不喝直到春天。」", a: "冬眠", o: ["冬眠", "午休", "群聚"] },
        { id: 78, q: "「蝙蝠是唯一會飛行的什麼類動物？」", a: "哺乳類", o: ["哺乳類", "鳥類", "爬行類"] },
        { id: 79, q: "「蚯蚓在土壤裡鑽洞，可以增加土壤的什麼量，對植物有益？」", a: "含氧量", o: ["含氧量", "含鹽量", "重金屬"] },
        { id: 80, q: "「愛護地球最好的方法是節能減碳，並減少什麼的產生？」", a: "垃圾", o: ["垃圾", "氧氣", "森林"] }
    ];

    let playedIds = JSON.parse(localStorage.getItem('natureQuizPlayedIds')) || [];
    let sessionQuests = [];
    let currentIndex = 0;
    let score = 0;
    let sessionHistory = [];

    function init() {
        const remainingCount = fullQuestonDB.length - playedIds.length;
        
        if (remainingCount === 0) {
            document.getElementById('remaining-count').innerText = "🎉 恭喜！你已完成全部 80 則探險紀錄！";
            document.getElementById('start-btn').style.display = "none";
            document.getElementById('restart-all-btn').style.display = "block";
        } else {
            document.getElementById('remaining-count').innerText = `筆記中還有 ${remainingCount} 則未知的紀錄待分析...`;
            document.getElementById('start-btn').style.display = "block";
            document.getElementById('restart-all-btn').style.display = "none";
        }
    }

    function startGame() {
        const remaining = fullQuestonDB.filter(q => !playedIds.includes(q.id));
        if (remaining.length === 0) return;

        sessionQuests = remaining.sort(() => Math.random() - 0.5).slice(0, 5);
        document.getElementById('screen-intro').classList.remove('active');
        document.getElementById('screen-game').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        const q = sessionQuests[currentIndex];
        document.getElementById('progress-header').innerText = `目前調查進度：${currentIndex + 1} / 5`;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('feedback').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        
        const container = document.getElementById('options-container');
        container.innerHTML = "";

        [...q.o].sort(() => Math.random() - 0.5).forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'card';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt);
            container.appendChild(btn);
        });
    }

    function checkAnswer(btn, selected) {
        const q = sessionQuests[currentIndex];
        const isCorrect = (selected === q.a);
        document.querySelectorAll('.card').forEach(c => c.style.pointerEvents = "none");

        if (isCorrect) {
            btn.classList.add('correct');
            document.getElementById('feedback').innerHTML = "<span style='color:#2e7d32'>✨ 紀錄成功！分析完全正確。</span>";
            score++;
        } else {
            btn.classList.add('wrong');
            document.getElementById('feedback').innerHTML = `<span style='color:#d32f2f'>💡 錯誤！正確真相是「${q.a}」</span>`;
        }

        sessionHistory.push({ q: q.q, user: selected, correct: q.a, status: isCorrect });
        playedIds.push(q.id);
        localStorage.setItem('natureQuizPlayedIds', JSON.stringify(playedIds));
        document.getElementById('next-btn').style.display = "block";
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < sessionQuests.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('screen-game').classList.remove('active');
        document.getElementById('screen-result').classList.add('active');
        document.getElementById('score-display').innerText = `本次分析成功：${score} 項`;
        
        let title = score === 5 ? "🎖️ 傳奇觀察家" : score >= 3 ? "🧭 精英特派員" : "🎒 實習探險隊員";
        document.getElementById('title-display').innerText = `獲得稱號：${title}`;
        
        const list = document.getElementById('review-list');
        list.innerHTML = "";
        sessionHistory.forEach((r) => {
            const item = document.createElement('div');
            item.style.padding = "10px";
            item.style.borderBottom = "1px solid #eee";
            item.innerHTML = `
                <span style="color:${r.status?'#2e7d32':'#ef5350'}; font-weight:bold;">${r.status?'[成功]':'[修正]'}</span> 
                ${r.q}<br>
                <small>分析答案：${r.user} ${r.status?'':' (真相：'+r.correct+')'}</small>
            `;
            list.appendChild(item);
        });
    }

    function resetMemory() {
        if(confirm("確定要重啟整個探險筆記的全紀錄嗎？")) {
            localStorage.removeItem('natureQuizPlayedIds');
            location.reload();
        }
    }

    init();
</script>
</body>
</html>
